<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  
  <!-- Map Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Safe Zone Map Routes -->
  <path d="M 150,120 L 250,220 L 420,180 L 580,310 L 690,290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" opacity="0.6" />
  <path d="M 220,380 L 320,310 L 420,380 M 420,180 L 480,90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Radar Rings (SOS Source) -->
  <circle cx="420" cy="180" r="160" fill="url(#glow)" />
  <circle cx="420" cy="180" r="120" fill="none" stroke="#ef4444" stroke-opacity="0.15" stroke-width="1" />
  <circle cx="420" cy="180" r="80" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="2" />
  <circle cx="420" cy="180" r="40" fill="none" stroke="#ef4444" stroke-opacity="0.6" stroke-width="3" />
  <circle cx="420" cy="180" r="8" fill="url(#accent)" />
  
  <!-- Safe Zones -->
  <g transform="translate(250, 220)">
    <circle cx="0" cy="0" r="28" fill="#10b981" fill-opacity="0.1" />
    <circle cx="0" cy="0" r="8" fill="#10b981" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
  </g>
  
  <g transform="translate(580, 310)">
    <circle cx="0" cy="0" r="28" fill="#10b981" fill-opacity="0.1" />
    <circle cx="0" cy="0" r="8" fill="#10b981" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- Dashboard Glass Card UI Overlay -->
  <rect x="30" y="30" width="260" height="200" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" style="backdrop-filter: blur(8px);" />
  
  <!-- Window Controls -->
  <circle cx="50" cy="50" r="5" fill="#ef4444" />
  <circle cx="65" cy="50" r="5" fill="#f59e0b" />
  <circle cx="80" cy="50" r="5" fill="#10b981" />
  
  <!-- Card Text -->
  <text x="50" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">SafeGuard SOS Active</text>
  <text x="50" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8">REAL-TIME EMERGENCY ALERT</text>
  
  <!-- Stats rows -->
  <rect x="50" y="130" width="220" height="2" fill="#ef4444" fill-opacity="0.5" />
  
  <text x="50" y="152" font-family="sans-serif" font-size="12" fill="#e2e8f0">SOS Broadcasted</text>
  <text x="230" y="152" font-family="sans-serif" font-size="12" fill="#f87171" font-weight="bold" text-anchor="end">LIVE</text>
  
  <text x="50" y="174" font-family="sans-serif" font-size="12" fill="#e2e8f0">Active Responders</text>
  <text x="230" y="174" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="end">4 Online</text>

  <text x="50" y="196" font-family="sans-serif" font-size="12" fill="#e2e8f0">Safe Zone Radius</text>
  <text x="230" y="196" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="bold" text-anchor="end">500m</text>

  <!-- Live User Marker -->
  <g transform="translate(690, 290)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
  </g>

  <!-- Connection Status -->
  <rect x="630" y="30" width="140" height="35" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="650" cy="48" r="4" fill="#34d399" />
  <text x="662" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">SOCKET.IO CONNECTED</text>
</svg>
