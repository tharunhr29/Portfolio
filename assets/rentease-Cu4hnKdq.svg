<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" />

  <!-- Background Glowing Circles -->
  <circle cx="650" cy="150" r="180" fill="#8b5cf6" fill-opacity="0.1" filter="blur(40px)" />
  <circle cx="150" cy="350" r="180" fill="#3b82f6" fill-opacity="0.1" filter="blur(40px)" />

  <!-- Furniture Catalog Cards (Mock UI) -->
  <g transform="translate(60, 80)">
    <!-- Main Big Card (Product View) -->
    <rect x="0" y="0" width="420" height="340" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <!-- Header tabs -->
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="40" cy="25" r="5" fill="#f59e0b" />
    <circle cx="55" cy="25" r="5" fill="#10b981" />
    
    <!-- Couch Drawing (Minimalist Vector) -->
    <g transform="translate(60, 70)" stroke="url(#primaryGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Backrest -->
      <path d="M 20,110 L 20,40 C 20,30 40,20 80,20 L 220,20 C 260,20 280,30 280,40 L 280,110" />
      <!-- Cushions line -->
      <line x1="30" y1="80" x2="270" y2="80" />
      <line x1="150" y1="40" x2="150" y2="120" />
      <!-- Left armrest -->
      <path d="M 10,70 L 40,70 C 50,70 50,120 40,120 L 10,120 C 0,120 0,70 10,70 Z" fill="#1e1b4b" fill-opacity="0.5" />
      <!-- Right armrest -->
      <path d="M 260,70 L 290,70 C 300,70 300,120 290,120 L 260,120 C 250,120 250,70 260,70 Z" fill="#1e1b4b" fill-opacity="0.5" />
      <!-- Main base seat -->
      <rect x="40" y="90" width="220" height="30" rx="4" fill="#312e81" fill-opacity="0.3" />
      <!-- Legs -->
      <line x1="60" y1="120" x2="50" y2="140" />
      <line x1="240" y1="120" x2="250" y2="140" />
    </g>

    <!-- Product Info -->
    <text x="30" y="270" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Nordic Velvet Lounge Sofa</text>
    <text x="30" y="295" font-family="sans-serif" font-size="13" fill="#94a3b8">Premium Living Room Collection</text>
    <text x="30" y="320" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">₹899/mo</text>
    <rect x="300" y="292" width="90" height="30" rx="6" fill="#8b5cf6" />
    <text x="345" y="311" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Rent Now</text>
  </g>

  <!-- Admin Dashboard Panel / Stats Overlay -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="230" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">ACTIVE RENTALS</text>
    <text x="20" y="65" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">1,482</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#34d399">+18% Monthly growth</text>
    
    <!-- Mini Sparkline -->
    <path d="M 20,130 L 50,120 L 80,125 L 110,105 L 140,115 L 170,95 L 210,102" fill="none" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- Razorpay / Checkout Flow Card -->
  <g transform="translate(510, 260)">
    <rect x="0" y="0" width="230" height="160" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">SECURE PAYMENT</text>
    
    <!-- Visa/Mastercard Icon & Razorpay text -->
    <rect x="20" y="50" width="190" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5" />
    <circle cx="45" cy="70" r="10" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="55" cy="70" r="10" fill="#f59e0b" fill-opacity="0.8" />
    <text x="80" y="74" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Razorpay Secured</text>
    
    <!-- Verification Status -->
    <circle cx="25" cy="125" r="7" fill="#10b981" />
    <path d="M 22,125 L 24,127 L 28,122" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="40" y="129" font-family="sans-serif" font-size="12" fill="#e2e8f0">OTP Verified</text>
  </g>
</svg>
