<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" />

  <!-- Background Ambient Lights -->
  <circle cx="400" cy="250" r="220" fill="#06b6d4" fill-opacity="0.08" filter="blur(50px)" />
  
  <!-- Hospital Queue Screen Layout -->
  <g transform="translate(60, 60)">
    <!-- Main Queue Display Monitor -->
    <rect x="0" y="0" width="680" height="380" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
    
    <!-- Window header tabs -->
    <circle cx="25" cy="25" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="25" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="55" cy="25" r="5" fill="#10b981" opacity="0.8" />
    <text x="340" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">SmartCare Queue Monitor - LIVE</text>
    
    <!-- Queue Cards Row -->
    <g transform="translate(30, 60)">
      <!-- Counter 1 -->
      <rect x="0" y="0" width="180" height="150" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1.5" />
      <text x="90" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#06b6d4" text-anchor="middle">COUNTER 01</text>
      <text x="90" y="90" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">A-104</text>
      <text x="90" y="130" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dr. Sarah Connor (Cardiology)</text>
      
      <!-- Counter 2 -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="180" height="150" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="90" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">COUNTER 02</text>
        <text x="90" y="90" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">B-211</text>
        <text x="90" y="130" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dr. John Doe (General)</text>
      </g>
      
      <!-- Counter 3 -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="180" height="150" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="90" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">COUNTER 03</text>
        <text x="90" y="90" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">C-082</text>
        <text x="90" y="130" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dr. Rick Grimes (Orthopedic)</text>
      </g>
    </g>

    <!-- Bottom details: Queue Ticket Flow and Live Statistics -->
    <g transform="translate(30, 235)">
      <!-- Timeline queue tracker -->
      <rect x="0" y="0" width="420" height="115" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Live Patient Progress Tracking</text>
      
      <!-- Stepper component -->
      <g transform="translate(20, 65)">
        <!-- Step lines -->
        <line x1="20" y1="0" x2="360" y2="0" stroke="#1e293b" stroke-width="4" />
        <line x1="20" y1="0" x2="260" y2="0" stroke="#06b6d4" stroke-width="4" />
        
        <!-- Step 1 (Registered) -->
        <circle cx="20" cy="0" r="10" fill="#06b6d4" />
        <circle cx="20" cy="0" r="4" fill="#ffffff" />
        <text x="20" y="25" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Registered</text>
        
        <!-- Step 2 (Token Issued) -->
        <circle cx="140" cy="0" r="10" fill="#06b6d4" />
        <circle cx="140" cy="0" r="4" fill="#ffffff" />
        <text x="140" y="25" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Token Issued</text>
        
        <!-- Step 3 (In Queue) -->
        <circle cx="260" cy="0" r="10" fill="#06b6d4" />
        <circle cx="260" cy="0" r="4" fill="#ffffff" />
        <text x="260" y="25" font-family="sans-serif" font-size="9" fill="#06b6d4" font-weight="bold" text-anchor="middle">Calling Next</text>
        
        <!-- Step 4 (Treated) -->
        <circle cx="360" cy="0" r="10" fill="#1e293b" />
        <text x="360" y="25" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Completed</text>
      </g>
    </g>

    <!-- Side Queue Info -->
    <g transform="translate(470, 235)">
      <rect x="0" y="0" width="180" height="115" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="20" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">STATISTICS</text>
      
      <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">Avg. Wait Time</text>
      <text x="160" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">12 mins</text>
      
      <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#e2e8f0">Active Tickets</text>
      <text x="160" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">32 Patients</text>
      
      <text x="20" y="102" font-family="sans-serif" font-size="11" fill="#34d399">Socket.IO real-time active</text>
    </g>
  </g>
</svg>
