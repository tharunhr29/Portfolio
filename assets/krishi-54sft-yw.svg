<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="qcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" />

  <!-- Background Glowing Circles -->
  <circle cx="650" cy="150" r="180" fill="#f59e0b" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="150" cy="350" r="180" fill="#10b981" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Tractor Catalog Card (Mock UI) -->
  <g transform="translate(60, 80)">
    <!-- Main Big Card (Product View) -->
    <rect x="0" y="0" width="420" height="340" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <!-- Header browser-like tabs -->
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="40" cy="25" r="5" fill="#f59e0b" />
    <circle cx="55" cy="25" r="5" fill="#10b981" />
    <text x="80" y="29" font-family="sans-serif" font-size="11" fill="#64748b">krishirentals.in/catalog/tractor-deere</text>

    <!-- Tractor Vector Drawing -->
    <g transform="translate(70, 70)">
      <!-- Ground Line -->
      <line x1="10" y1="135" x2="270" y2="135" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="5 5" />
      
      <!-- Back Wheel (Big) -->
      <circle cx="70" cy="100" r="35" fill="none" stroke="url(#primaryGrad)" stroke-width="4" />
      <circle cx="70" cy="100" r="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
      <path d="M 70,65 L 70,135 M 35,100 L 105,100 M 45,75 L 95,125 M 45,125 L 95,75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

      <!-- Front Wheel (Small) -->
      <circle cx="210" cy="115" r="20" fill="none" stroke="url(#primaryGrad)" stroke-width="4" />
      <circle cx="210" cy="115" r="8" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
      <path d="M 210,95 L 210,135 M 190,115 L 230,115" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

      <!-- Tractor Body / Cabin -->
      <!-- Engine Hood -->
      <path d="M 125,90 L 195,90 L 195,120 L 125,120 Z" fill="#047857" fill-opacity="0.4" stroke="url(#primaryGrad)" stroke-width="3" />
      <!-- Grill / Front -->
      <path d="M 195,90 L 210,90 L 210,115 L 195,120 Z" fill="#065f46" fill-opacity="0.6" stroke="url(#primaryGrad)" stroke-width="2" />
      
      <!-- Cabin Structure -->
      <path d="M 80,90 L 80,45 C 80,40 85,35 90,35 L 140,35 C 145,35 150,40 150,45 L 140,90 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
      <!-- Seat inside cabin -->
      <path d="M 95,85 L 110,85 L 110,70" fill="none" stroke="#f59e0b" stroke-dasharray="none" stroke-width="2" />
      
      <!-- Exhaust pipe -->
      <line x1="175" y1="90" x2="175" y2="40" stroke="#f59e0b" stroke-width="3" />
      <line x1="175" y1="40" x2="185" y2="35" stroke="#f59e0b" stroke-width="2" />
      
      <!-- Connector bar -->
      <line x1="105" y1="115" x2="190" y2="115" stroke="url(#primaryGrad)" stroke-width="3" />
    </g>

    <!-- Product Info -->
    <text x="30" y="265" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">John Deere 5050D Tractor</text>
    <text x="30" y="290" font-family="sans-serif" font-size="13" fill="#94a3b8">Heavy-Duty Agriculture Machinery</text>
    <text x="30" y="315" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10b981">₹2,499/day</text>
    <rect x="300" y="287" width="90" height="30" rx="6" fill="#10b981" />
    <text x="345" y="306" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Book Now</text>
  </g>

  <!-- Right Top Card: QC-Locked Inventory Status -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="230" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">INVENTORY LOCK STATUS</text>
    
    <!-- QC Lock Status Box -->
    <rect x="20" y="50" width="190" height="42" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="url(#qcGrad)" stroke-width="1.5" />
    <circle cx="38" cy="71" r="8" fill="#ef4444" />
    <text x="56" y="75" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171">return_pending_qc</text>
    
    <!-- QC Explanation subtext -->
    <text x="20" y="115" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Returned machinery locked for QC</text>
    <text x="20" y="130" font-family="sans-serif" font-size="10.5" fill="#94a3b8">inspection before pool release.</text>
  </g>

  <!-- Right Bottom Card: Fines Deduction / Rental Costing -->
  <g transform="translate(510, 260)">
    <rect x="0" y="0" width="230" height="160" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="28" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#94a3b8">RENTAL COST &amp; FINES</text>
    
    <!-- Formula UI -->
    <text x="20" y="55" font-family="monospace" font-size="11" fill="#f59e0b">Total Rent = Price × Duration</text>
    <text x="20" y="72" font-family="monospace" font-size="11" fill="#e2e8f0">Hold = Total Rent + Deposit</text>
    
    <!-- Divider -->
    <line x1="20" y1="88" x2="210" y2="88" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Fine Deduction Refund Example -->
    <text x="20" y="108" font-family="sans-serif" font-size="11" fill="#94a3b8">Damage return penalty deduction:</text>
    <text x="20" y="128" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171">Refund = Deposit - Fine</text>
    
    <!-- Calculation success check icon -->
    <circle cx="200" cy="125" r="7" fill="#10b981" />
    <path d="M 197,125 L 199,127 L 203,122" fill="none" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
